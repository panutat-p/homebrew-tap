name: Update Cask

on:
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release metadata
        env:
          CASK: ${{ github.event.client_payload.cask }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          if [[ "$CASK" != "hyperzen" ]]; then
            echo "Unsupported cask: $CASK" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a semantic version: $VERSION" >&2
            exit 1
          fi

          if [[ ! "$SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "SHA256 must be a 64-character hexadecimal value" >&2
            exit 1
          fi

      - name: Render cask
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          mkdir -p Casks
          sed \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__SHA256__/$SHA256/g" \
            .github/cask-templates/hyperzen.rb > Casks/hyperzen.rb
          ruby -c Casks/hyperzen.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git add Casks/hyperzen.rb
          if git diff --cached --quiet; then
            echo "Cask is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump hyperzen to v$VERSION"
          git push
